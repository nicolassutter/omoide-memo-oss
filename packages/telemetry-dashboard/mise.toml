[tasks."generate:openapi"]
description = "Generate the OpenAPI spec and sdk"
run =  [
  "cd ../telemetry-api && mise run generate:openapi",
  "bun ./tools/generate-openapi.ts",
]
# setup caching so generation only happens as needed
sources = [ "../telemetry-api/doc/openapi.yaml" ]
outputs = [ "app/lib/telemetry-sdk/**" ]
