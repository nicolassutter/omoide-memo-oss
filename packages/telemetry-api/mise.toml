[tools]
go = "1.27.1"
"go:github.com/air-verse/air" = "latest"

[tasks.dev]
description = "Start the hot-reloading dev server"
run = "air"

[tasks."generate:openapi"]
description = "Generate the OpenAPI spec"
run = "mkdir -p doc && go run . openapi > doc/openapi.yaml"

[tasks.test]
description = "Run HTTP integration tests (requires Docker)"
run = "go test ./..."
