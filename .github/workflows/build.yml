name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api-runtime
            image: telemetry-api
          - target: dashboard-runtime
            image: telemetry-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          install_args: yq@latest

      - name: Resolve tool versions from mise.toml
        id: versions
        run: |
          echo "go=$(mise exec yq -- yq '.tools.go' packages/telemetry-api/mise.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(mise exec yq -- yq '.tools.node' packages/telemetry-dashboard/mise.toml)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise exec yq -- yq '.tools.pnpm' packages/telemetry-dashboard/mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
