services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: omoide-oss-caddy
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw

  # tailscale handles its traffic
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - API_PROXY_TO=${API_PROXY_TO:-telemetry-api:9999}
      - TELEMETRY_ADMIN_API_KEY=${TELEMETRY_ADMIN_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  # served from outside hence the exposed port
  telemetry-api:
    image: ${IMAGE_PREFIX:-}telemetry-api:latest
    restart: unless-stopped
    ports:
      - "${TELEMETRY_API_HOST_PORT:-9999}:9999"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - TELEMETRY_PUBLIC_API_KEY=${TELEMETRY_PUBLIC_API_KEY}
      - TELEMETRY_ADMIN_API_KEY=${TELEMETRY_ADMIN_API_KEY}
      - PORT=9999
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # served by caddy, check Caddyfile
  telemetry-dashboard:
    image: ${IMAGE_PREFIX:-}telemetry-dashboard:latest
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    depends_on:
      telemetry-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:3000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  postgres_data:
  tailscale_state:
